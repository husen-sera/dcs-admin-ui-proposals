<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCS Admin UI — Three Proposals</title>
<meta name="description" content="Three proposals for modernizing the DCS Django admin with free, commercially-licensed open-source UI libraries.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%239a3412%27/%3E%3Crect x=%277%27 y=%279%27 width=%2718%27 height=%273%27 rx=%271.5%27 fill=%27white%27/%3E%3Crect x=%277%27 y=%2715%27 width=%2712%27 height=%273%27 rx=%271.5%27 fill=%27white%27 opacity=%27.7%27/%3E%3Crect x=%277%27 y=%2721%27 width=%2715%27 height=%273%27 rx=%271.5%27 fill=%27white%27 opacity=%27.45%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfa; --panel:#ffffff; --ink:#1a1a18; --ink-2:#55544e; --ink-3:#8a897f;
  --line:#e5e4df; --line-2:#efeeea;
  --accent:#9a3412; --accent-soft:#fff3ec;
  --ok:#15803d; --ok-soft:#eefbf2; --warn:#a16207; --warn-soft:#fdf8e7; --bad:#b91c1c; --bad-soft:#fdf0ef;
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --bg:#17160f; --panel:#1f1e17; --ink:#f2f0e6; --ink-2:#b4b2a4; --ink-3:#84827a;
  --line:#343228; --line-2:#2a2821;
  --accent:#fb923c; --accent-soft:#2b1d11;
  --ok:#4ade80; --ok-soft:#14241a; --warn:#fbbf24; --warn-soft:#2a2211; --bad:#f87171; --bad-soft:#2a1615;
}}
:root[data-theme="dark"]{
  --bg:#17160f; --panel:#1f1e17; --ink:#f2f0e6; --ink-2:#b4b2a4; --ink-3:#84827a;
  --line:#343228; --line-2:#2a2821;
  --accent:#fb923c; --accent-soft:#2b1d11;
  --ok:#4ade80; --ok-soft:#14241a; --warn:#fbbf24; --warn-soft:#2a2211; --bad:#f87171; --bad-soft:#2a1615;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.75;font-feature-settings:"palt" 1;}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}

/* ---- masthead ---- */
header.top{padding:64px 0 36px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 14px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.25;margin:0 0 18px;letter-spacing:-.02em;font-weight:700}
.lede{font-size:17px;color:var(--ink-2);margin:0;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:5px 13px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}

/* ---- sections ---- */
section{padding:52px 0;border-bottom:1px solid var(--line-2)}
h2{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin:0 0 8px}
h2 + .h2sub{font-size:25px;font-weight:700;letter-spacing:-.015em;margin:0 0 22px;line-height:1.35}
h3{font-size:18px;margin:34px 0 10px;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 15px;max-width:72ch}
ul{margin:0 0 15px;padding-left:1.3em;max-width:72ch}
li{margin:5px 0}
code{font-family:var(--mono);font-size:.875em;background:var(--line-2);
  padding:.14em .4em;border-radius:4px}

/* ---- callouts ---- */
.note{border-left:3px solid var(--line);background:var(--panel);padding:14px 18px;
  border-radius:0 var(--radius) var(--radius) 0;margin:20px 0;font-size:14.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}

/* ---- tables ---- */
.tscroll{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tscroll table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tscroll th,.tscroll td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tscroll thead th{background:var(--line-2);font-weight:600;font-size:12.5px;color:var(--ink-2);
  letter-spacing:.02em;white-space:nowrap}
.tscroll tbody tr:last-child td{border-bottom:0}
.tscroll td.num{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}

/* ---- candidate cards ---- */
.cand{margin:44px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.cand > .hd{padding:22px 24px 20px;border-bottom:1px solid var(--line-2)}
.cand .rank{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.cand .rank .dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:12px;letter-spacing:0}
.cand h3{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.015em}
.cand .sub{font-size:14px;color:var(--ink-2);margin:0}
.cand .body{padding:22px 24px 26px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.pros{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin-top:22px}
@media(max-width:640px){.pros{grid-template-columns:1fr}}
.pros h4{margin:0 0 7px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pros ul{margin:0;padding-left:1.15em;font-size:14px}
.rec{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
  border-radius:var(--radius);padding:15px 18px;margin-top:22px;font-size:14.5px}
.rec b{color:var(--accent)}

/* =======================================================
   MOCKUP FRAME — the browser shell every example sits in
   ======================================================= */
.shot{margin:22px 0 6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.18);background:#fff}
.shot .bar{display:flex;align-items:center;gap:8px;padding:9px 13px;background:#e9e8e4;
  border-bottom:1px solid #d7d6d1}
.shot .bar i{width:10px;height:10px;border-radius:50%;background:#c5c4bf;display:block}
.shot .bar .url{flex:1;background:#fff;border-radius:5px;font-family:var(--mono);font-size:10.5px;
  color:#6d6c66;padding:3.5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font-size:12.5px;color:var(--ink-3);margin:0 0 26px;padding-left:2px}
.cand .body > .shot{margin-left:-24px;margin-right:-24px;border-left:0;border-right:0;border-radius:0}
@media(max-width:640px){.cand .body{padding-left:14px;padding-right:14px}
 .cand .body > .shot{margin-left:-14px;margin-right:-14px}}
.cap b{color:var(--ink-2);font-weight:600}

/* the mock viewport: fixed design width, scaled down so layout never reflows */
.vp{width:100%;overflow:hidden;background:#fff}
.vp > .inner{width:1600px;transform-origin:0 0;font-size:13px;line-height:1.5;
  font-family:'Inter','Noto Sans JP',-apple-system,sans-serif;color:#111}
/* scale is set per-breakpoint via --s */
/* --s is measured per element by the script at the end of <body>; this is the
   no-JS fallback, deliberately small enough to fit the narrowest phone. */
.vp{--s:.19}
.vp > .inner{transform:scale(var(--s))}
.vp.h-list{height:calc(620px * var(--s))}
.vp.h-sum{height:calc(560px * var(--s))}
.vp > .inner{height:0}
.vp.h-list > .inner{height:620px}
.vp.h-sum > .inner{height:560px}
</style>
</head>
<body>
<div class="wrap">
